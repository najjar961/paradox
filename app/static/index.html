<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Paradox</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand"><svg class="logo" viewBox="14 8 42 50" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M15 14a5 5 0 0 1 5-5h15l10 10v18H32v14H20a5 5 0 0 1-5-5Z M22.7 19h9.6a1.7 1.7 0 0 1 0 3.4h-9.6a1.7 1.7 0 0 1 0 -3.4ZM22.7 26.5h5.1a1.7 1.7 0 0 1 0 3.4h-5.1a1.7 1.7 0 0 1 0 -3.4Z"/><rect x="33" y="38" width="8" height="8" rx="1.6" fill="currentColor" opacity="1"/><rect x="42.5" y="46" width="6.4" height="6.4" rx="1.6" fill="currentColor" opacity="0.75"/><rect x="50.5" y="52.5" width="4.6" height="4.6" rx="1.6" fill="currentColor" opacity="0.5"/></svg>Paradox</div>
      <p class="muted" data-i18n>Chat with your documents. Everything lives in memory and disappears when you leave.</p>
      <label><span data-i18n>Username</span><input name="username" autocomplete="username" required maxlength="64"></label>
      <label><span data-i18n>Password</span><input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <button type="submit" class="primary" data-i18n>Sign in</button>
      <select id="lang-login" class="lang lang-login" aria-label="Language" data-i18n-attr="aria-label"></select>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><svg class="logo" viewBox="14 8 42 50" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M15 14a5 5 0 0 1 5-5h15l10 10v18H32v14H20a5 5 0 0 1-5-5Z M22.7 19h9.6a1.7 1.7 0 0 1 0 3.4h-9.6a1.7 1.7 0 0 1 0 -3.4ZM22.7 26.5h5.1a1.7 1.7 0 0 1 0 3.4h-5.1a1.7 1.7 0 0 1 0 -3.4Z"/><rect x="33" y="38" width="8" height="8" rx="1.6" fill="currentColor" opacity="1"/><rect x="42.5" y="46" width="6.4" height="6.4" rx="1.6" fill="currentColor" opacity="0.75"/><rect x="50.5" y="52.5" width="4.6" height="4.6" rx="1.6" fill="currentColor" opacity="0.5"/></svg>Paradox</div>
      <div class="side-head">
        <span data-i18n>Workspaces</span>
        <button id="new-ws" class="icon" title="New workspace" aria-label="New workspace" data-i18n-attr="title,aria-label">+</button>
      </div>
      <nav id="ws-list" class="ws-list"></nav>
      <div class="side-foot">
        <div class="paradoxl-note">
          <strong data-i18n>Nothing is saved.</strong>
          <span id="idle-note"></span>
        </div>
        <div class="user-row">
          <span id="who"></span>
          <button id="logout" class="ghost" data-i18n>Sign out &amp; wipe</button>
        </div>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <button id="menu" class="icon only-mobile" aria-label="Workspaces" data-i18n-attr="aria-label">☰</button>
        <h1 id="ws-title" title="Rename" data-i18n-attr="title">Workspace</h1>
        <div class="top-actions">
          <span id="model-tag" class="tag"></span>
          <button id="toggle-docs" class="ghost"><span data-i18n>Documents</span> <span id="doc-count" class="count">0</span></button>
          <button id="toggle-settings" class="ghost" data-i18n>Settings</button>
          <select id="lang" class="lang" aria-label="Language" data-i18n-attr="aria-label"></select>
        </div>
      </header>

      <div class="body">
        <div class="chat-col">
          <div id="messages" class="messages" aria-live="polite"></div>
          <div id="layout-row" class="layout-row" hidden>
            <label class="switch"><input type="checkbox" id="keep-layout" checked> <span data-i18n>Keep original layout</span></label>
            <small class="muted" data-i18n>Changes are applied to your original file.</small>
          </div>
          <div id="tasks" class="tasks" role="toolbar" aria-label="Quick tasks" data-i18n-attr="aria-label"></div>
          <form id="chat-form" class="composer">
            <textarea id="chat-input" dir="auto" rows="1" maxlength="8000" placeholder="Ask anything, or ask Paradox to edit your document…" required data-i18n-attr="placeholder"></textarea>
            <button id="send" type="submit" class="primary">Send</button>
          </form>
        </div>

        <aside id="docs-panel" class="panel" hidden>
          <h2 data-i18n>Documents</h2>
          <label id="drop" class="drop">
            <input id="file-input" type="file" multiple hidden>
            <span data-i18n-html>Drop files here or <u>browse</u></span>
            <small id="supported" class="muted"></small>
          </label>
          <ul id="doc-list" class="doc-list"></ul>
        </aside>

        <aside id="settings-panel" class="panel" hidden>
          <h2 data-i18n>Workspace settings</h2>
          <label><span data-i18n>Name</span><input id="ws-name" maxlength="80"></label>
          <label><span data-i18n>Instructions for the model</span>
            <textarea id="ws-prompt" rows="6" maxlength="4000" placeholder="e.g. Answer as a security auditor. Be concise." data-i18n-attr="placeholder"></textarea>
          </label>
          <button id="save-settings" class="primary" data-i18n>Save</button>
          <hr>
          <button id="clear-chat" class="ghost" data-i18n>Clear chat history</button>
          <button id="delete-ws" class="danger" data-i18n>Delete workspace</button>
        </aside>
      </div>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon" type="button" aria-label="Close" data-i18n-attr="aria-label">✕</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-foot" class="modal-foot"></footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/i18n.js"></script>
  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/markdown.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
